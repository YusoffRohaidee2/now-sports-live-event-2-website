<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Now Sports Live Event 2 | Sports Hub Official</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

	<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23ef4444'/></svg>" type="image/svg+xml">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Inter:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
        }
        .font-sports {
            font-family: 'Teko', sans-serif;
            text-transform: uppercase;
        }
        .glass-panel {
            background: rgba(18, 24, 38, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glow-effect {
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.15);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Header Navigation -->
    <header class="glass-panel sticky top-0 z-50 px-6 py-4 border-b border-gray-800">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <img src="https://i.ibb.co/CKstTbC0/download-2.png" alt="Now Sports Logo" class="h-10 object-contain">
                <div class="hidden sm:block border-l border-gray-700 pl-4">
                    <span class="text-xs text-blue-400 font-bold tracking-widest block uppercase">Now Sports Live Event 2</span>
                    <span class="text-xs text-gray-400">by Sports Hub Official</span>
                </div>
            </div>
            
            <div class="flex items-center">
                <span class="bg-gray-800 text-gray-400 border border-gray-700 text-xs font-bold px-3 py-1 rounded-full flex items-center gap-2">
                    <span class="w-2 h-2 bg-gray-500 rounded-full"></span> OFFLINE
                </span>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-7xl mx-auto px-4 py-12 w-full flex-grow flex items-center justify-center">
        
        <div class="max-w-2xl w-full">
            <!-- Event Ended Banner Container -->
            <div class="glass-panel rounded-2xl p-8 md:p-12 text-center glow-effect border border-red-500/20">
                
                <!-- Icon Status -->
                <div class="w-20 h-20 bg-red-500/10 border border-red-500/30 rounded-full flex items-center justify-center mx-auto mb-6">
                    <i class="fas fa-broadcast-tower text-3xl text-red-500"></i>
                </div>

                <!-- Text Notice -->
                <span class="bg-red-500/20 text-red-400 border border-red-500/30 text-xs font-black tracking-widest px-4 py-1.5 rounded-full uppercase">
                    Broadcast Ended
                </span>

                <h1 class="text-3xl md:text-5xl font-black mt-6 mb-3 text-white">
                    Live Event Ended
                </h1>

                <p class="text-gray-400 text-sm md:text-base max-w-md mx-auto mb-8">
                    Thank you for watching! This broadcast has concluded. Please wait for the next live event.
                </p>

                <!-- Action / Information Card -->
                <div class="bg-gray-900/80 rounded-xl p-4 border border-gray-800 flex items-center justify-center gap-3 text-xs text-gray-400 max-w-sm mx-auto">
                    <i class="fas fa-clock text-blue-400"></i>
                    <span>Stay tuned for upcoming match schedules.</span>
                </div>

            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="glass-panel border-t border-gray-800 py-6 text-center text-xs text-gray-500">
        <p>&copy; 2026 Now Sports Live Event 2 | Sports Hub Official. All Rights Reserved.</p>
    </footer>

</body>
</html>
